<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics Dashboard</title>
  <script src="https://unpkg.com/@shopify/app-bridge@3"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f6f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      width: 480px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    .subtitle { color: #6d7175; font-size: 0.9rem; margin-bottom: 32px; }
    button {
      background: #008060;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }
    button:hover:not(:disabled) { background: #006e52; }
    button:disabled { background: #b5b5b5; cursor: not-allowed; }
    #status { margin-top: 20px; font-size: 0.9rem; padding: 12px; border-radius: 6px; display: none; }
    .success { background: #e3f1ec; color: #008060; display: block !important; }
    .error   { background: #fce8e6; color: #d72c0d; display: block !important; }
    .last-sync { margin-top: 16px; color: #6d7175; font-size: 0.82rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Analytics Dashboard</h1>
    <p class="subtitle">Sync your Shopify store data to your analytics dashboard.</p>
    <button id="sync-btn">Sync to Dashboard</button>
    <div id="status"></div>
    <div id="last-sync" class="last-sync"></div>
  </div>

  <script>
    const params  = new URLSearchParams(location.search);
    const shop    = params.get("shop");
    const host    = params.get("host");

    // App Bridge — embeds app inside Shopify admin
    if (host && window["app-bridge"]) {
      window["app-bridge"].createApp({
        apiKey: "33a6dec34588c871842dce3611a8db11",
        host,
      });
    }

    // Load last sync time
    fetch(`/api/shop?shop=${shop}`)
      .then(r => r.json())
      .then(data => {
        if (data.lastSyncedAt) {
          document.getElementById("last-sync").textContent =
            "Last synced: " + new Date(data.lastSyncedAt).toLocaleString();
        }
      })
      .catch(() => {});

    // Sync button
    document.getElementById("sync-btn").addEventListener("click", async () => {
      const btn    = document.getElementById("sync-btn");
      const status = document.getElementById("status");

      btn.disabled    = true;
      btn.textContent = "Syncing...";
      status.className = "";
      status.textContent = "";

      try {
        const res  = await fetch(`/api/sync?shop=${shop}`, { method: "POST" });
        const data = await res.json();

        if (data.success) {
          status.className   = "success";
          status.textContent =
            `Synced — ${data.metrics.successfulQueries} queries in ${data.metrics.processingTimeMs}ms`;
          document.getElementById("last-sync").textContent =
            "Last synced: " + new Date().toLocaleString();
        } else {
          status.className   = "error";
          status.textContent = "Error: " + data.error;
        }
      } catch (err) {
        status.className   = "error";
        status.textContent = "Network error: " + err.message;
      }

      btn.disabled    = false;
      btn.textContent = "Sync to Dashboard";
    });
  </script>
</body>
</html>
